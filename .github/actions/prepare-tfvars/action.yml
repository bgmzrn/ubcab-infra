name: Prepare tfvars
description: >
  Require committed stacks/<stack>/<tf_env>.tfvars.
  Optional secrets.tfvars (gitignored) is passed as a second -var-file by callers.
inputs:
  stack:
    required: true
  tf_env:
    required: true
runs:
  using: composite
  steps:
    - name: Ensure base tfvars file
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        TF_ENV: ${{ inputs.tf_env }}
      run: |
        set -euo pipefail
        dest="stacks/${STACK}/${TF_ENV}.tfvars"
        if [[ ! -f "$dest" ]]; then
          echo "::error::Missing committed $dest. Add stacks/${STACK}/${TF_ENV}.tfvars (aws_profile=\"\") and commit it."
          exit 1
        fi
        echo "Using committed $dest"
        if [[ -f "stacks/${STACK}/secrets.tfvars" ]]; then
          echo "Found stacks/${STACK}/secrets.tfvars (will be second -var-file; overrides top-level vars)"
        fi
