name: Setup AWS credentials
description: >
  Assume the per-account IAM role via GitHub Actions OIDC
  (aws-actions/configure-aws-credentials). No static keys or Vault.
inputs:
  role_arn:
    description: >
      IAM role ARN to assume (from environments.yaml / matrix).
      Typically arn:aws:iam::<account_id>:role/gha-tf-shared.
    required: true
  region:
    description: AWS region
    required: false
    default: ap-southeast-1
runs:
  using: composite
  steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role_arn }}
        aws-region: ${{ inputs.region }}
        # Match stacks/iam github_actions_oidc.tf audience.
        audience: sts.amazonaws.com
