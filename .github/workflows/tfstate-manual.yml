name: tfstate-manual

on:
  workflow_dispatch:
    inputs:
      tf_env:
        description: "Account-scoped tf_env (from environments.yaml accounts)"
        required: true
        type: choice
        options:
          - nonprod
          - prod
      action:
        description: "plan or apply"
        required: true
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

jobs:
  resolve-env:
    runs-on: ubuntu-24.04
    outputs:
      github_environment: ${{ steps.cfg.outputs.github_environment }}
      aws_role_arn: ${{ steps.cfg.outputs.aws_role_arn }}
    steps:
      - uses: actions/checkout@v5
      - id: cfg
        env:
          TF_ENV: ${{ inputs.tf_env }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/*.sh
          # shellcheck source=/dev/null
          source .github/scripts/stack-lib.sh
          echo "github_environment=$(github_environment_for_account "$TF_ENV")" >> "$GITHUB_OUTPUT"
          echo "aws_role_arn=$(github_actions_role_arn_for_account "$TF_ENV")" >> "$GITHUB_OUTPUT"

  tfstate:
    needs: resolve-env
    runs-on: ubuntu-24.04
    environment: ${{ needs.resolve-env.outputs.github_environment }}
    env:
      AWS_DEFAULT_REGION: ap-southeast-1
    defaults:
      run:
        working-directory: stacks/tfstate
    steps:
      - uses: actions/checkout@v5

      - name: Setup AWS credentials
        uses: ./.github/actions/setup-aws-creds
        with:
          role_arn: ${{ needs.resolve-env.outputs.aws_role_arn }}

      - name: Prepare tfvars
        uses: ./.github/actions/prepare-tfvars
        with:
          stack: tfstate
          tf_env: ${{ inputs.tf_env }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Terraform init
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/ci-terraform.sh" init "${{ inputs.tf_env }}" tfstate

      - name: Terraform plan
        if: inputs.action == 'plan'
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/ci-terraform.sh" plan "${{ inputs.tf_env }}"

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/ci-terraform.sh" apply "${{ inputs.tf_env }}"
