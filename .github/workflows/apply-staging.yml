name: apply-staging

on:
  push:
    branches:
      - release-candidate/*
  workflow_dispatch:
    inputs:
      force_stacks:
        description: "Comma-separated stage-scoped stacks (account stacks are always skipped)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    uses: ./.github/workflows/terraform-apply.yml
    with:
      git_target: staging
      github_environment: staging
      force_stacks: ${{ github.event.inputs.force_stacks || '' }}
      before_sha: ${{ github.event.before || '' }}
      after_sha: ${{ github.sha }}
    secrets: inherit
