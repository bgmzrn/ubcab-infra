name: terraform-apply

on:
  workflow_call:
    inputs:
      force_stacks:
        required: false
        type: string
        default: ""
      include_manual:
        required: false
        type: boolean
        default: false
      include_gated:
        description: "Include auto_apply=false targets (prod)"
        required: false
        type: boolean
        default: false
      only_tf_env:
        description: "Optional: only this tf_env (account or stage name)"
        required: false
        type: string
        default: ""
      terraform_version:
        required: false
        type: string
        default: "1.17.1"
      before_sha:
        required: false
        type: string
        default: ""
      after_sha:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has_stacks: ${{ steps.set.outputs.has_stacks }}
      skip_apply: ${{ steps.skip.outputs.skip_apply }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check #skip-apply
        id: skip
        run: |
          msg=$(jq -r '.head_commit.message // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
          if echo "$msg" | grep -q '#skip-apply'; then
            echo "skip_apply=true" >> "$GITHUB_OUTPUT"
            echo "Commit contains #skip-apply — skipping apply"
          else
            echo "skip_apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve stacks
        id: resolve
        if: steps.skip.outputs.skip_apply != 'true'
        env:
          MODE: apply
          FORCE_STACKS: ${{ inputs.force_stacks }}
          INCLUDE_MANUAL: ${{ inputs.include_manual }}
          INCLUDE_GATED: ${{ inputs.include_gated }}
          ONLY_TF_ENV: ${{ inputs.only_tf_env }}
          BEFORE_SHA: ${{ inputs.before_sha }}
          AFTER_SHA: ${{ inputs.after_sha }}
        run: |
          chmod +x .github/scripts/*.sh
          .github/scripts/resolve-stacks.sh

      - name: Set outputs
        id: set
        env:
          RESOLVED_MATRIX: ${{ steps.resolve.outputs.matrix }}
          RESOLVED_HAS: ${{ steps.resolve.outputs.has_stacks }}
          SKIP: ${{ steps.skip.outputs.skip_apply }}
        run: |
          if [[ "$SKIP" == "true" ]]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "has_stacks=false" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=${RESOLVED_MATRIX}" >> "$GITHUB_OUTPUT"
            echo "has_stacks=${RESOLVED_HAS}" >> "$GITHUB_OUTPUT"
          fi

  apply:
    needs: resolve
    if: needs.resolve.outputs.skip_apply != 'true' && needs.resolve.outputs.has_stacks == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ matrix.github_environment }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    concurrency:
      group: infra-${{ matrix.tf_env }}-${{ matrix.stack }}
      cancel-in-progress: false
    env:
      AWS_DEFAULT_REGION: ap-southeast-1
    defaults:
      run:
        working-directory: stacks/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup AWS credentials
        uses: ./.github/actions/setup-aws-creds
        with:
          role_arn: ${{ matrix.aws_role_arn }}


      - name: Prepare tfvars
        uses: ./.github/actions/prepare-tfvars
        with:
          stack: ${{ matrix.stack }}
          tf_env: ${{ matrix.tf_env }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Terraform init
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/ci-terraform.sh" init "${{ matrix.tf_env }}" "${{ matrix.stack }}"

      - name: Terraform apply
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/ci-terraform.sh" apply "${{ matrix.tf_env }}"
