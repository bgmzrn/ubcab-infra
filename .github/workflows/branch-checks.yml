name: branch-checks

on:
  pull_request:
    branches:
      - development
      - release-candidate/*
      - main

permissions:
  contents: read

jobs:
  branch-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch pairing rules
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          echo "PR $HEAD_REF → $BASE_REF"

          if [[ "$BASE_REF" == "main" ]]; then
            if [[ "$HEAD_REF" != release-candidate/* && "$HEAD_REF" != hotfix/* && "$HEAD_REF" != feature/* ]]; then
              echo "::error::Only release-candidate/*, hotfix/*, or feature/* may merge into main"
              exit 1
            fi
          elif [[ "$BASE_REF" == release-candidate || "$BASE_REF" == release-candidate/* ]]; then
            if [[ "$HEAD_REF" != feature/* && "$HEAD_REF" != hotfix/* ]]; then
              echo "::error::Only feature/* or hotfix/* may merge into release-candidate/*"
              exit 1
            fi
          elif [[ "$BASE_REF" == "development" ]]; then
            if [[ "$HEAD_REF" != feature/* && "$HEAD_REF" != hotfix/* ]]; then
              echo "::error::Only feature/* or hotfix/* may merge into development"
              exit 1
            fi
          fi

          echo "Branch pairing OK"
