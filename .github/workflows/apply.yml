name: apply

on:
  push:
    branches:
      - main
    tags:
      - "prod-v*"
  workflow_dispatch:
    inputs:
      force_stacks:
        description: "Comma-separated stacks (empty = path diff / all on dispatch)"
        required: false
        default: ""
      only_tf_env:
        description: "Optional tf_env filter (nonprod|prod|dev|staging)"
        required: false
        default: ""
      include_gated:
        description: "Include auto_apply=false targets (e.g. prod)"
        required: false
        type: boolean
        default: false
      include_manual:
        description: "Include manual-only stacks (tfstate, iam)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    uses: ./.github/workflows/terraform-apply.yml
    with:
      force_stacks: ${{ github.event.inputs.force_stacks || '' }}
      # prod-v* tags: plan all prod stacks at that SHA, wait for Environment
      # approval, then apply the saved plans.
      only_tf_env: ${{ startsWith(github.ref, 'refs/tags/prod-v') && 'prod' || github.event.inputs.only_tf_env || '' }}
      include_gated: ${{ startsWith(github.ref, 'refs/tags/prod-v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.include_gated == 'true') }}
      include_manual: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.include_manual == 'true' }}
      approval_environment: prod
      # Tag pushes: no path diff — plan/apply every prod-eligible stack.
      before_sha: ${{ startsWith(github.ref, 'refs/tags/') && '' || github.event.before || '' }}
      after_sha: ${{ startsWith(github.ref, 'refs/tags/') && '' || github.sha }}
