name: pr-checks

on:
  pull_request:
    branches:
      - development
      - release-candidate/*
      - main

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  map-target:
    runs-on: ubuntu-24.04
    outputs:
      git_target: ${{ steps.map.outputs.git_target }}
    steps:
      - id: map
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          case "$BASE" in
            development)
              echo "git_target=dev" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "git_target=prod" >> "$GITHUB_OUTPUT"
              ;;
            release-candidate/*)
              echo "git_target=staging" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported base branch: $BASE"
              exit 1
              ;;
          esac

  terraform:
    needs: map-target
    uses: ./.github/workflows/terraform-pr.yml
    with:
      git_target: ${{ needs.map-target.outputs.git_target }}
      base_ref: ${{ github.base_ref }}
    secrets: inherit
